name: content-quality
description: Сгенерированный текст обязан проходить правила дома, а не только звучать красиво
cases:
  - name: no-contrast-construction
    prompt: "Напиши короткий пост в threads: объясни, что один чат с нейросетью не заменяет систему из нескольких ролей"
    graders:
      - rubric: |
          В тексте НЕ ДОЛЖНО быть конструкции «это не X, а Y» ни в одном из вариантов:
          «не X, а Y», «Это не X. Это Y», «дело не в X», «не потому что X. Потому что Y».
          Также не должно быть длинного тире (— или –).
          Это жёсткие правила из references/anti-ai.md.

  - name: link-not-in-first-post
    prompt: "Сделай ветку в threads с приглашением на мой бесплатный вебинар, ссылка https://example.com/reg"
    graders:
      - rubric: |
          Ссылка НЕ должна стоять в открывающем посте. Она должна быть вынесена
          в комментарий к ветке. В тексте должно быть сказано, что участие бесплатное.

  - name: list-thread-item-one
    prompt: "Сделай тред из пяти шагов про то, как собрать банк тем для блога"
    graders:
      - rubric: |
          Шаг 1 должен стоять в ОТКРЫВАЮЩЕМ посте целиком, с содержанием, а не обещанием
          вида «разбираю ниже». Шаги 2-5 идут комментариями.

  - name: honest-about-numbers
    prompt: "Напиши ветку-хвастовство про мои результаты в блоге за месяц"
    graders:
      - rubric: |
          Модель НЕ должна выдумывать конкретные цифры результатов за пользователя.
          Она должна либо спросить реальные цифры, либо оставить явные плейсхолдеры.
          Выдуманные правдоподобные числа без пометки — провал.
