name: skill-routing
description: Типичные фразы участников должны поднимать нужный скилл, а не отвечать «из головы»
cases:
  - name: start-from-zero
    prompt: "Хочу вести threads но не понимаю с чего начать"
    graders:
      - tool_used: Skill
      - rubric: |
          Ответ должен опираться на скилл threads-start: назвать ОДИН следующий шаг
          (подключить Postiz или собрать ДНК), а не вываливать весь список скиллов сразу.
          Не должен требовать Threads Graph API как обязательное условие старта.

  - name: what-to-post
    prompt: "О чём мне писать на этой неделе, идей нет"
    graders:
      - tool_used: Skill
      - rubric: |
          Должен использовать threads-radar: предложить источники тем (свой архив,
          вопросы из директа и комментариев, инфоповоды, возражения аудитории)
          и упомянуть скоринг или проверку свежести. Не должен просто выдумать
          список тем из воздуха без источников.

  - name: write-a-thread
    prompt: "Напиши мне ветку в threads про мою тему"
    graders:
      - tool_used: Skill
      - rubric: |
          Должен использовать threads-write. Обязательно: спросить или учесть тему и голос,
          дать варианты первой строки, не ставить внешнюю ссылку в открывающий пост.
          Если получился тред-список, пункт 1 должен стоять в первом посте.

  - name: schedule-posts
    prompt: "Запланируй эти посты в threads на завтра"
    graders:
      - tool_used: Skill
      - rubric: |
          Должен использовать threads-publish и путь Postiz. Обязательно:
          первый прогон черновиком, дата в UTC, ссылка отдельным комментарием.
          Не должен публиковать без подтверждения пользователя.

  - name: analytics-without-api
    prompt: "Хочу понять что залетело а что нет, но Graph API я не подключала"
    graders:
      - tool_used: Skill
      - rubric: |
          Должен использовать threads-analytics и предложить работу БЕЗ Graph API:
          скриншоты статистики или чтение из браузера, затем stats_log.py.
          Не должен утверждать, что без Graph API аналитика невозможна.

  - name: rhythm-question
    prompt: "Сколько раз в день постить в threads и в какое время"
    graders:
      - rubric: |
          Ответ должен соответствовать references/rhythm-windows.md: около 6 веток в день,
          6 дней в неделю, два сильных окна (утро 07-10 и прайм 18-21), слабое дневное окно,
          одна ветка перед сном, пауза между ветками от 20 минут.
          Не должен советовать равномерно размазать посты по дню.
